<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILO Fractional-N PLL — Reverse Edge Injection 互動教材</title>
    <script>
      // Set theme before first paint to avoid flash. Default: light.
      (function () {
        var mode = 'light';
        try {
          if (localStorage.getItem('ilo-theme') === 'dark') mode = 'dark';
        } catch (e) { /* localStorage unavailable */ }
        document.documentElement.setAttribute('data-theme', mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
